# This is a basic workflow to help you get started with Actions

name: Release

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      Type:
        description: 'Choose which version to bump before release (patch, minor or major), or publish-only to publish the current version without a bump'
        required: true
        default: 'patch'

permissions:
  contents: read
  # Lets npm publish through trusted publishing (OIDC) instead of a token.
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          token: ${{secrets.ASGARDIO_GITHUB_BOT_TOKEN}}
        if: github.repository == 'asgardeo/asgardeo-auth-spa-sdk'

      - uses: actions/checkout@v2
        if: github.repository != 'asgardeo/asgardeo-auth-spa-sdk'

      # When the trusted publishing token exchange fails, npm publishes without credentials and only fails with an
      # E404 at the end. This step does the same exchange first, so the release stops before anything is bumped,
      # pushed or released.
      - name: Check npm trusted publishing
        run: |
          package=$(jq -r .name lib/package.json)
          id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty') || true
          if [ -z "$id_token" ]; then
            echo "::error::Could not get a GitHub OIDC token. The workflow needs the id-token: write permission."
            exit 1
          fi
          echo "::add-mask::$id_token"
          exchange="$RUNNER_TEMP/npm-token-exchange.json"
          status=$(curl -sS -o "$exchange" -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${package/\//%2f}") || true
          has_token=$(jq -r 'has("token")' "$exchange" 2>/dev/null) || has_token=false
          message=$(jq -r '.message // empty' "$exchange" 2>/dev/null) || message=""
          rm -f "$exchange"
          if [ "$has_token" != "true" ]; then
            echo "::error::npm does not accept a trusted publish of $package from this workflow (HTTP $status: $message). Check the trusted publisher of $package on npmjs.com: organization asgardeo, repository asgardeo-auth-spa-sdk, workflow release.yml."
            exit 1
          fi
          echo "npm accepts a trusted publish of $package from this workflow."

      # publish-only is for a release whose npm publish failed: it publishes from that release's tag and skips the
      # version bump and the GitHub release, which the release already has.
      - name: Check out the release tag
        if: github.event.inputs.Type == 'publish-only'
        run: |
          tag=v$(jq -r .version lib/package.json)
          git fetch --depth 1 origin tag $tag
          git checkout $tag

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Bump Version
        if: github.event.inputs.Type != 'publish-only'
        run: |
          git config --global user.email "version.bump@github.action.com"
          git config --global user.name "asgardeo-github-bot"
          npm run bump-${{ github.event.inputs.Type }}-version
          git push --follow-tags

      - name: Pack Release Artifacts
        run: |
          mkdir artifacts
          if test -d samples
          then
            cd samples
            rm -rf **/node_modules/
            rm -rf **/build/
            for dir in */ ; do
                zip -r "../artifacts/${dir%/}.zip" $dir
            done
          fi

      - name: Release Asgardeo Auth SPA SDK
        if: github.event.inputs.Type != 'publish-only'
        run: |
          version=`git describe --tags --abbrev=0`
          echo ${{secrets.ASGARDIO_GITHUB_BOT_TOKEN}} | gh auth login --with-token
          if test -d samples
          then
            gh release create $version artifacts/*
          else
            gh release create $version
          fi

      # Trusted publishing needs npm 11.5.1 or later, which ships with Node.js 24.
      - name: Use Node.js 24 for publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish Asgardeo Auth SPA SDK
        run: |
          cp README.md lib
          cd lib
          npm publish --access public
